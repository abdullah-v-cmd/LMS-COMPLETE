name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lms_ci
          POSTGRES_USER: lms_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms_ci -d lms_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lms_ci:ci_only_password@localhost:5432/lms_ci?schema=public
      DIRECT_URL: postgresql://lms_ci:ci_only_password@localhost:5432/lms_ci?schema=public
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci_access_secret_0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci_refresh_secret_0123456789abcdef0123456789abcdef
      REPORT_CARD_SIGNING_SECRET: ci_report_card_signing_secret_0123456789abcdef
      COUNSELING_ENCRYPTION_SECRET: ci_counseling_encryption_secret_0123456789abcdef
      FINANCE_ENCRYPTION_SECRET: ci_finance_encryption_secret_0123456789abcdef
      REDIS_URL: redis://localhost:6379
      REDIS_ENABLED: "true"
      STORAGE_PROVIDER: LOCAL
      CLIENT_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm --prefix server run db:generate
      - name: Run Database Migrations
        run: npm --prefix server run db:deploy
      - name: Seed Database
        run: npm --prefix server run db:seed
      - name: Build Server
        run: npm run build:server
      - name: Build Client
        run: npm run build:client
      - name: Run Backend Tests
        run: npm run test:server
